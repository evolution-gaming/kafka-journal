# AppendReplicateApp settings

# msokolov: I have no idea why these specific overrides are needed, could be removed?

evolutiongaming.kafka-journal {

  persistence.journal {
    kafka {
      bootstrap-servers = [
        "localhost:9092",
        "localhost:9093",
        "localhost:9094",
      ]

      producer {
        max-request-size = 8388608
      }
    }

    cassandra {
      # configuration of the Java driver 4, in the format of its `datastax-java-driver` section
      client {
        basic {
          contact-points = ["0.0.0.0:9042"]
          load-balancing-policy.local-datacenter = "datacenter1"
          request.consistency = "ONE"
        }
        advanced.reconnection-policy {
          base-delay = 300ms
          max-delay = 1s
        }
      }
    }
  }

  replicator {
    kafka = ${evolutiongaming.kafka-journal.persistence.journal.kafka}
    cassandra = ${evolutiongaming.kafka-journal.persistence.journal.cassandra}

    topic-discovery-interval = 1s
  }
}