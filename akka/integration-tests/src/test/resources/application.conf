# Base settings for Kafka-Journal integration tests
# Should be loaded using SharedItEnv

# connectivity params for services shared between integration tests
# SharedItEnv starts testcontainers on random available ports and overrides these values with the real ones
shared-test-services {
  cassandra {
    host = "127.0.0.1"
    port = 9042
    local-datacenter = "datacenter1"
  }
  kafkaBootstrapServers = "localhost:9092"
}

akka {
  loglevel = "WARNING"
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
  log-dead-letters = off
  log-dead-letters-during-shutdown = off
  persistence {
    journal.plugin = "evolutiongaming.kafka-journal.persistence.journal"
    snapshot-store.plugin = "akka.persistence.no-snapshot-store"
  }

  test {
    timefactor = 2.0
  }
}

evolutiongaming.kafka-journal {

  # eventual-cassandra config shared between Kafka-Journal plugin/client components and replicator
  cassandra {
    # configuration of the Java driver 4, in the format of its `datastax-java-driver` section
    client {
      basic {
        contact-points = [${shared-test-services.cassandra.host}":"${shared-test-services.cassandra.port}]
        load-balancing-policy.local-datacenter = ${shared-test-services.cassandra.local-datacenter}
        request.consistency = "ONE"
      }
      advanced.reconnection-policy {
        base-delay = 300ms
        max-delay = 1s
      }
    }
  }

  # journal kafka config shared between Kafka-Journal plugin/client components and replicator
  kafka {
    bootstrap-servers = ${shared-test-services.kafkaBootstrapServers}
  }

  persistence.journal {

    kafka = ${evolutiongaming.kafka-journal.kafka}
    kafka {
      producer {
        max-request-size = 8388608
      }
    }

    cassandra = ${evolutiongaming.kafka-journal.cassandra}

    circuit-breaker {
      call-timeout = 1m
      reset-timeout = 2m
    }
  }

  # configuration for the replicator instance shared between integration tests
  replicator {
    topic-discovery-interval = 1s

    kafka = ${evolutiongaming.kafka-journal.kafka}

    cassandra = ${evolutiongaming.kafka-journal.cassandra}
  }
}
